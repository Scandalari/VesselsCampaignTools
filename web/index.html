<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kizuna Tablet</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">KIZUNA</span>
      <span class="brand-sub">TABLET</span>
    </div>
    <nav class="tabs" id="tabs">
      <!-- rendered by app.js based on current mode -->
    </nav>
    <div class="status">
      <button id="open-settings" class="status-btn">SETTINGS</button>
      <span id="version" class="version">v0.0.0</span>
    </div>
  </header>

  <main class="stage">
    <section class="view active" data-view="dashboard">
      <div class="dashboard" id="dashboard">
        <!-- rendered by app.js — view mode vs config mode -->
      </div>
    </section>

    <!-- PLAYER views (placeholders for now) -->
    <section class="view" data-view="inventory">
      <div class="empty">
        <h1>INVENTORY</h1>
        <p class="subtle">No items carried.</p>
      </div>
    </section>
    <section class="view" data-view="logs">
      <div class="empty">
        <h1>LOGS</h1>
        <p class="subtle">No entries.</p>
      </div>
    </section>
    <section class="view" data-view="notes">
      <div class="empty">
        <h1>NOTES</h1>
        <p class="subtle">Nothing recorded.</p>
      </div>
    </section>

    <!-- DM views (placeholders for now) -->
    <section class="view" data-view="party">
      <div class="empty">
        <h1>PARTY</h1>
        <p class="subtle">No vessels registered.</p>
      </div>
    </section>
    <section class="view" data-view="combat">
      <div class="empty">
        <h1>COMBAT</h1>
        <p class="subtle">No engagement active.</p>
      </div>
    </section>
    <section class="view" data-view="loot">
      <div class="empty">
        <h1>LOOT</h1>
        <p class="subtle">No drops queued.</p>
      </div>
    </section>

    <section class="view" data-view="settings">
      <div class="settings-panel">
        <h1>SETTINGS</h1>

        <div class="row">
          <span class="row-label">Mode</span>
          <div class="mode-switch" id="mode-switch">
            <button class="mode-option" data-mode="player">PLAYER</button>
            <button class="mode-option" data-mode="dm">DM</button>
          </div>
        </div>

        <div class="row">
          <span class="row-label">Version</span>
          <span id="settings-version" class="row-value">v0.0.0</span>
        </div>
        <div class="row">
          <span class="row-label">Updates</span>
          <button id="check-update" class="btn">CHECK FOR UPDATE</button>
        </div>
        <div id="update-status" class="update-status"></div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
