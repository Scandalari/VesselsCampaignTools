<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kizuna Tablet</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">KIZUNA</span>
      <span class="brand-sub">TABLET</span>
    </div>
    <nav class="tabs">
      <button class="tab active" data-view="dashboard">DASHBOARD</button>
      <button class="tab" data-view="party">PARTY</button>
      <button class="tab" data-view="log">LOG</button>
      <button class="tab" data-view="settings">SETTINGS</button>
    </nav>
    <div class="status">
      <span id="version" class="version">v0.0.0</span>
    </div>
  </header>

  <main class="stage">
    <section class="view active" data-view="dashboard">
      <div class="empty">
        <h1>SYSTEM ONLINE</h1>
        <p class="subtle">Awaiting transmission.</p>
      </div>
    </section>

    <section class="view" data-view="party">
      <div class="empty">
        <h1>PARTY</h1>
        <p class="subtle">No vessels registered.</p>
      </div>
    </section>

    <section class="view" data-view="log">
      <div class="empty">
        <h1>SESSION LOG</h1>
        <p class="subtle">No entries.</p>
      </div>
    </section>

    <section class="view" data-view="settings">
      <div class="settings-panel">
        <h1>SETTINGS</h1>
        <div class="row">
          <span class="row-label">Version</span>
          <span id="settings-version" class="row-value">v0.0.0</span>
        </div>
        <div class="row">
          <span class="row-label">Updates</span>
          <button id="check-update" class="btn">CHECK FOR UPDATE</button>
        </div>
        <div id="update-status" class="update-status"></div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
