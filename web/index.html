<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kizuna Tablet</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">KIZUNA</span>
      <span class="brand-sub">TABLET</span>
    </div>
    <nav class="tabs" id="tabs">
      <!-- rendered by app.js based on current mode -->
    </nav>
    <div class="status">
      <button id="open-settings" class="status-btn">SETTINGS</button>
      <span id="version" class="version">v0.0.0</span>
    </div>
  </header>

  <main class="stage">
    <section class="view active" data-view="dashboard">
      <div class="dashboard" id="dashboard">
        <!-- rendered by app.js — view mode vs config mode -->
      </div>
    </section>

    <!-- PLAYER views -->
    <section class="view" data-view="inventory">
      <div class="inventory" id="inventory">
        <!-- rendered by app.js -->
      </div>
    </section>
    <section class="view" data-view="logs">
      <div class="logs-container" id="logs">
        <!-- rendered by app.js -->
      </div>
    </section>
    <section class="view" data-view="notes">
      <div class="notes-container" id="notes">
        <!-- rendered by app.js -->
      </div>
    </section>

    <!-- DM views -->
    <section class="view" data-view="dm-dashboard">
      <div class="dm-dashboard" id="dm-dashboard">
        <!-- rendered by app.js -->
      </div>
    </section>
    <section class="view" data-view="party">
      <div class="party-container" id="party">
        <!-- rendered by app.js -->
      </div>
    </section>
    <section class="view" data-view="combat">
      <div class="combat-container" id="combat">
        <!-- rendered by app.js -->
      </div>
    </section>
    <section class="view" data-view="loot">
      <div class="loot-container" id="loot">
        <!-- rendered by app.js -->
      </div>
    </section>

    <section class="view" data-view="settings">
      <div class="settings-panel">
        <h1>SETTINGS</h1>

        <div class="row">
          <span class="row-label">Mode</span>
          <div class="mode-switch" id="mode-switch">
            <button class="mode-option" data-mode="player">PLAYER</button>
            <button class="mode-option" data-mode="dm">DM</button>
          </div>
        </div>

        <div class="row">
          <span class="row-label">Version</span>
          <span id="settings-version" class="row-value">v0.0.0</span>
        </div>
        <div class="row">
          <span class="row-label">Updates</span>
          <button id="check-update" class="btn">CHECK FOR UPDATE</button>
        </div>
        <div id="update-status" class="update-status"></div>

        <div class="row" id="settings-import-row">
          <span class="row-label">Logbook</span>
          <button id="import-logbook" class="btn">IMPORT LOGBOOK</button>
        </div>
        <div id="import-logbook-status" class="update-status"></div>
      </div>
    </section>
  </main>

  <!-- items.js declares window.items (~638 D&D items) for the Loot tab roller. -->
  <script src="items.js"></script>
  <script src="app.js"></script>
</body>
</html>
